# Pythia — iOS Xcode project definition (XcodeGen).
# Generates Pythia.xcodeproj: the `Pythia` framework (the platform-agnostic
# companion) + the `Pythia` app (the native SwiftUI shell that speaks).
name: Pythia
options:
  bundleIdPrefix: com.aethercodex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: T53VJ978V4
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pythia:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Pythia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethercodex.pythia.framework
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.9"
  PythiaApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/PythiaCompanionApp
    dependencies:
      - target: Pythia
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethercodex.pythia
        PRODUCT_NAME: Pythia
        PRODUCT_MODULE_NAME: PythiaApp
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T53VJ978V4