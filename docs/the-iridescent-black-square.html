<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Iridescent Black Square — by Kashmiri Malewitch</title>
    <meta name="description" content="An iridescent black square — void saturated with spectrum. Cover art for ÆtherCodex.">
    <meta name="keywords" content="black square, black ray, iridescent dark mode, codex corax, null-light, prismatic darkness, malevitch reloaded, kashmiri malewitch">
    <style>
        :root{--void:#000;--astral:#0a0a0a;--white:#f8f9fa;--gold:#f39c12;--purple:#7c3aed;--blue:#4a90e2;--tag:#b9a6e8}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(135deg,var(--void) 0%,var(--astral) 100%);color:var(--white);min-height:100vh;font-family:"Syne","General Sans","Inter",sans-serif}
        .cover-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;text-align:center}
        .frame{max-width:620px;width:100%}
        .frame img{width:100%;height:auto;display:block;border-radius:2px;box-shadow:0 0 90px rgba(124,58,237,.35),0 0 14px rgba(74,144,226,.3);border:1px solid rgba(248,249,250,.12)}
        h1{margin:2.4rem 0 .4rem;font-size:clamp(1.4rem,3.2vw,2.3rem);font-weight:700;letter-spacing:.02em}
        .byline{color:var(--gold);font-style:italic;font-size:1.05rem;margin-bottom:2.2rem}
        .tags{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;max-width:620px}
        .tag{font-family:"Iosevka Curly","Fira Code",monospace;font-size:.78rem;padding:.3rem .8rem;border-radius:999px;border:1px solid rgba(124,58,237,.45);color:var(--tag);background:rgba(26,26,26,.6);letter-spacing:.03em}
        .tag:hover{border-color:var(--gold);color:var(--gold);transition:all .3s ease}
        .back{margin-top:2.6rem;color:var(--blue);text-decoration:none;border-bottom:1px solid transparent;font-size:.95rem}
        .back:hover{border-bottom-color:var(--purple);text-shadow:0 0 10px var(--purple)}
    </style>
</head>
<body>
    <div class="cover-wrap">
        <div class="frame">
            <img src="images/the-iridescent-black-square.png" alt="The Iridescent Black Square — by Kashmiri Malewitch">
        </div>
        <h1>The Iridescent Black Square</h1>
        <p class="byline">by Kashmiri Malewitch</p>
        <div class="tags">
            <span class="tag">▪ black square</span>
            <span class="tag">▪ black ray</span>
            <span class="tag">▪ iridescent dark mode</span>
            <span class="tag">▪ codex corax</span>
            <span class="tag">▪ null-light</span>
            <span class="tag">▪ prismatic darkness</span>
            <span class="tag">▪ malevitch reloaded</span>
        </div>
        <a class="back" href="https://github.com/dantiel/AetherCodex">← return to the Codex</a>
    </div>
</body>
</html>
